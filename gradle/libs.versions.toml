coil = "2.7.0"
kotlinxSerialization = "1.7.3"
coroutines = "1.8.1"
tdlib = "11850efeb5791d4fd386c0eeec1ebce4c5080435"
junit = "4.13.2"
androidxTestJunit = "1.2.1"
androidxTestCore = "1.6.1"
truth = "1.4.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
