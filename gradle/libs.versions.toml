[versions]
agp = "8.5.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.25"
coreKtx = "1.13.1"
composeBom = "2024.09.03"
activityCompose = "1.9.3"
lifecycle = "2.8.6"
navigation = "2.8.4"
room = "2.6.1"
work = "2.9.1"
datastore = "1.1.1"
securityCrypto = "1.1.0-alpha06"
biometric = "1.1.0"
