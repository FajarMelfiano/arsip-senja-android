name: Build APK

on:
  push:
    # Branch kerja perlu umpan balik juga, bukan hanya main. Tanpa ini
    # hardening branch bisa terpush tanpa pernah diuji CI sama sekali.
    branches: ["main", "master", "hardening-v2"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test + assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Pulihkan keystore debug persisten
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > debug.p12
            echo "keystore debug persisten dipulihkan"
          else
            echo "secret ANDROID_DEBUG_KEYSTORE_B64 kosong; pakai debug key bawaan"
          fi

      - name: Pastikan platform android-36 tersedia
        shell: bash
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Unit test JVM
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arsip-senja-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK ke Release (rolling)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/hardening-v2')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="debug-terbaru"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease \
              --title "APK Debug Terbaru (rolling)" \
              --notes "Rilis rolling: selalu berisi APK debug terbaru hasil CI."
          fi
          # Unggah SEMUA varian: per-ABI (arm64-v8a, armeabi-v7a, x86_64, x86)
          # + universal. --clobber menimpa berkas lama dengan nama sama.
          gh release upload "$TAG" app/build/outputs/apk/debug/*.apk --clobber
          gh release edit "$TAG" --prerelease \
            --notes "Build #${{ github.run_number }} — commit ${{ github.sha }} — $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Upload laporan test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-test
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
